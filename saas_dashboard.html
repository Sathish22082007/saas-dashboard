<script>
// ==================== MOCK DATA GENERATION ====================
const firstNames = ["James","Mary","John","Patricia","Robert","Jennifer","Michael","Linda","William","Elizabeth","David","Barbara","Richard","Susan","Joseph","Jessica","Thomas","Sarah","Charles","Karen","Christopher","Nancy","Daniel","Lisa","Matthew","Betty","Anthony","Margaret","Mark","Sandra","Donald","Ashley","Steven","Kimberly","Paul","Emily","Andrew","Donna","Joshua","Michelle","Kenneth","Dorothy","Kevin","Carol","Brian","Amanda","George","Melissa","Edward","Deborah","Ronald","Stephanie","Timothy","Rebecca","Jason","Sharon","Jeffrey","Laura","Ryan","Cynthia","Jacob","Kathleen","Gary","Amy","Nicholas","Shirley","Eric","Angela","Jonathan","Helen","Stephen","Anna","Larry","Brenda","Justin","Pamela","Scott","Nicole","Brandon","Emma","Benjamin","Samantha","Samuel","Katherine","Gregory","Christine","Frank","Debra","Alexander","Rachel","Raymond","Catherine","Patrick","Carolyn","Jack","Janet","Dennis","Ruth","Jerry","Maria"];
const lastNames = ["Smith","Johnson","Williams","Brown","Jones","Garcia","Miller","Davis","Rodriguez","Martinez","Hernandez","Lopez","Gonzalez","Wilson","Anderson","Thomas","Taylor","Moore","Jackson","Martin","Lee","Perez","Thompson","White","Harris","Sanchez","Clark","Ramirez","Lewis","Robinson","Walker","Young","Allen","King","Wright","Scott","Torres","Nguyen","Hill","Flores","Green","Adams","Nelson","Baker","Hall","Rivera","Campbell","Mitchell","Carter","Roberts","Gomez","Phillips","Evans","Turner","Diaz","Parker","Cruz","Edwards","Collins","Reyes","Stewart","Morris","Morales","Murphy","Cook","Rogers","Gutierrez","Ortiz","Morgan","Cooper","Peterson","Bailey","Reed","Kelly","Howard","Ramos","Kim","Cox","Ward","Richardson","Watson","Brooks","Chavez","Wood","James","Bennett","Gray","Mendoza","Ruiz","Hughes","Price","Alvarez","Castillo","Sanders"];
const domains = ["gmail.com","yahoo.com","outlook.com","hotmail.com","icloud.com","protonmail.com","techcorp.com","innovate.io","startup.xyz","enterprise.co","digital.agency","cloud.net","solutions.dev","consulting.biz","ventures.tech"];
const roles = ["admin","editor","user"];
const roleWeights = [0.1, 0.2, 0.7];
const statuses = ["active","inactive","pending"];
const statusWeights = [0.8, 0.15, 0.05];
const plans = ["free","pro","enterprise"];
const planWeights = [0.5, 0.35, 0.15];
const timezones = ["America/New_York","America/Chicago","America/Denver","America/Los_Angeles","Europe/London","Europe/Paris","Europe/Berlin","Asia/Tokyo","Asia/Singapore","Australia/Sydney"];
const bios = ["Product Manager with 5+ years experience","Full-stack developer passionate about UX","Marketing specialist focused on growth","Data analyst and visualization expert","Customer success advocate","DevOps engineer and cloud architect","UX designer with a love for simplicity","Sales leader driving revenue growth","Content strategist and SEO expert","Engineering manager building great teams"];

function seededRandom(seed) {
  let s = seed;
  return function() {
    s = (s * 16807 + 0) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

function weightedRandom(items, weights, rng) {
  const r = rng();
  let sum = 0;
  for (let i = 0; i < items.length; i++) {
    sum += weights[i];
    if (r < sum) return items[i];
  }
  return items[items.length - 1];
}

function generateUsers(count = 150) {
  const users = [];
  const rng = seededRandom(42);
  for (let i = 0; i < count; i++) {
    const fn = firstNames[Math.floor(rng() * firstNames.length)];
    const ln = lastNames[Math.floor(rng() * lastNames.length)];
    const role = weightedRandom(roles, roleWeights, rng);
    const status = weightedRandom(statuses, statusWeights, rng);
    const plan = weightedRandom(plans, planWeights, rng);
    const domain = domains[Math.floor(rng() * domains.length)];
    const joined = new Date(2024 + Math.floor(rng() * 3), Math.floor(rng() * 12), Math.floor(rng() * 28) + 1);
    const lastActive = new Date(joined.getTime() + rng() * (Date.now() - joined.getTime()));
    users.push({
      id: `usr_${Math.random().toString(36).substr(2, 9)}_${i}`,
      name: `${fn} ${ln}`,
      email: `${fn.toLowerCase()}.${ln.toLowerCase()}@${domain}`,
      avatar: `https://api.dicebear.com/9.x/avataaars/svg?seed=${fn}${ln}${i}&backgroundColor=b6e3f4,c0aede,d1d4f9,ffd5dc,ffdfbf`,
      role, status, plan,
      lastActive: lastActive.toISOString(),
      joinedAt: joined.toISOString(),
      bio: bios[Math.floor(rng() * bios.length)],
      timezone: timezones[Math.floor(rng() * timezones.length)],
      language: "en"
    });
  }
  return users;
}

const productNames = ["Wireless Bluetooth Headphones Pro","Ergonomic Office Chair","Smart Fitness Watch","Portable SSD 1TB","USB-C Hub 7-in-1","Mechanical Keyboard RGB","4K Webcam with Mic","Standing Desk Converter","Noise Cancelling Earbuds","Wireless Charging Pad","Smart Home Hub","Bluetooth Speaker Mini","Laptop Stand Aluminum","Monitor Light Bar","Cable Management Kit","Desk Organizer Bamboo","Webcam Privacy Cover","Phone Mount Flexible","Tablet Stand Adjustable","Wireless Mouse Silent","Keyboard Wrist Rest","Monitor Arm Dual","Desk Pad Large","Cable Clips Adhesive","Power Strip Surge","LED Desk Lamp","Air Purifier Mini","Coffee Warmer USB","Foot Rest Ergonomic","Document Holder","Blue Light Glasses","Posture Corrector","Stress Ball Set","Fidget Cube","Desk Plant Artificial","Whiteboard Small","Sticky Notes Pack","Pen Holder Magnetic","Notebook Leather","Planner Weekly","Highlighter Set","Stapler Mini","Tape Dispenser","Scissors Premium","Ruler Metal","Calculator Scientific","Staple Remover","Hole Punch","Paper Clips Jumbo","Binder Clips Assorted","Rubber Bands Pack"];
const categories = ["Electronics","Office","Accessories","Furniture","Health","Software"];
const productStatuses = ["active","draft","archived"];
const productStatusWeights = [0.7, 0.2, 0.1];

function generateProducts(count = 50) {
  const products = [];
  const rng = seededRandom(123);
  for (let i = 0; i < count; i++) {
    const name = productNames[i % productNames.length] + (i >= productNames.length ? ` ${Math.floor(i / productNames.length) + 1}` : "");
    const category = categories[Math.floor(rng() * categories.length)];
    const status = weightedRandom(productStatuses, productStatusWeights, rng);
    const price = Math.floor(rng() * 200) + 19.99;
    const stock = Math.floor(rng() * 200);
    const sales = Math.floor(rng() * 2000);
    const created = new Date(2025 + Math.floor(rng() * 2), Math.floor(rng() * 12), Math.floor(rng() * 28) + 1);
    products.push({
      id: `prd_${Math.random().toString(36).substr(2, 9)}_${i}`,
      name, sku: `${category.slice(0,3).toUpperCase()}-2026-${String(i + 1).padStart(3, '0')}`,
      description: `Premium ${name.toLowerCase()} with advanced features and excellent build quality.`,
      category, price, stock, status,
      image: `https://placehold.co/400x400/${['4f46e5','10b981','f59e0b','3b82f6','8b5cf6','ef4444'][i % 6]}/ffffff?text=${encodeURIComponent(name.slice(0, 10))}`,
      sales, createdAt: created.toISOString(), updatedAt: new Date().toISOString()
    });
  }
  return products;
}

const orderStatuses = ["pending","processing","shipped","delivered","cancelled"];
const orderStatusWeights = [0.2, 0.15, 0.3, 0.3, 0.05];
const streets = ["123 Main St","456 Oak Ave","789 Pine Rd","321 Elm Blvd","654 Maple Dr","987 Cedar Ln","147 Birch Way","258 Spruce Ct","369 Willow Pl","741 Aspen Cir"];
const cities = ["New York","Los Angeles","Chicago","Houston","Phoenix","Philadelphia","San Antonio","San Diego","Dallas","San Jose"];
const states = ["NY","CA","IL","TX","AZ","PA","TX","CA","TX","CA"];

function generateOrders(count = 200, users, products) {
  const orders = [];
  const rng = seededRandom(456);
  for (let i = 0; i < count; i++) {
    const user = users[Math.floor(rng() * users.length)];
    const numItems = Math.floor(rng() * 3) + 1;
    const items = [];
    let total = 0;
    for (let j = 0; j < numItems; j++) {
      const prod = products[Math.floor(rng() * products.length)];
      const qty = Math.floor(rng() * 3) + 1;
      items.push({ productId: prod.id, productName: prod.name, quantity: qty, price: prod.price });
      total += prod.price * qty;
    }
    const status = weightedRandom(orderStatuses, orderStatusWeights, rng);
    const created = new Date(2026, Math.floor(rng() * 6), Math.floor(rng() * 28) + 1);
    orders.push({
      id: `ORD-${String(78000 + i).padStart(5, '0')}`,
      customerId: user.id, customerName: user.name, customerEmail: user.email,
      items, total: parseFloat(total.toFixed(2)), status,
      shippingAddress: { street: streets[Math.floor(rng() * streets.length)], city: cities[Math.floor(rng() * cities.length)], state: states[Math.floor(rng() * states.length)], zip: String(Math.floor(rng() * 90000) + 10000), country: "US" },
      createdAt: created.toISOString(), updatedAt: new Date(created.getTime() + rng() * 86400000).toISOString()
    });
  }
  return orders;
}

function generateRevenueData(days = 365) {
  const data = [];
  const rng = seededRandom(789);
  const baseRevenue = 3000;
  const baseOrders = 30;
  for (let i = 0; i < days; i++) {
    const date = new Date();
    date.setDate(date.getDate() - (days - i));
    const trend = i * 8;
    const seasonal = Math.sin(i / 30) * 1000;
    const noise = (rng() - 0.5) * 2000;
    data.push({
      date: date.toISOString().split('T')[0],
      revenue: Math.max(1000, Math.floor(baseRevenue + trend + seasonal + noise)),
      orders: Math.max(5, Math.floor(baseOrders + i / 10 + (rng() - 0.5) * 20))
    });
  }
  return data;
}

const trafficSources = [
  { name: "Organic", value: 4500, color: "#4f46e5" },
  { name: "Direct", value: 3200, color: "#10b981" },
  { name: "Social", value: 2800, color: "#f59e0b" },
  { name: "Referral", value: 1900, color: "#3b82f6" },
  { name: "Email", value: 1500, color: "#8b5cf6" },
  { name: "Paid", value: 1100, color: "#ef4444" }
];

const activityTypes = ["signup","order","payment","upgrade","ticket"];
const activityDescriptions = {
  signup: (name) => `${name} signed up for a new account`,
  order: (name, id) => `${name} placed order ${id}`,
  payment: (name, amount) => `${name} made a payment of $${amount}`,
  upgrade: (name, plan) => `${name} upgraded to ${plan} plan`,
  ticket: (name) => `${name} submitted a support ticket`
};

function generateActivities(count = 100, users, orders) {
  const activities = [];
  const rng = seededRandom(101);
  for (let i = 0; i < count; i++) {
    const type = activityTypes[Math.floor(rng() * activityTypes.length)];
    const user = users[Math.floor(rng() * users.length)];
    const order = orders[Math.floor(rng() * orders.length)];
    const created = new Date(Date.now() - rng() * 604800000); // Last 7 days
    let desc;
    if (type === "order") desc = activityDescriptions.order(user.name, order.id);
    else if (type === "payment") desc = activityDescriptions.payment(user.name, (rng() * 500).toFixed(2));
    else if (type === "upgrade") desc = activityDescriptions.upgrade(user.name, plans[Math.floor(rng() * 3)]);
    else desc = activityDescriptions[type](user.name);
    activities.push({ id: `act_${i}`, type, userId: user.id, userName: user.name, description: desc, createdAt: created.toISOString() });
  }
  return activities.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
}

// ==================== STATE MANAGEMENT ====================
const AppState = {
  auth: { user: null, isAuthenticated: false, token: null },
  theme: { mode: 'system', sidebarCollapsed: false, density: 'comfortable', accentColor: '#4f46e5' },
  ui: { currentPage: 'dashboard', sidebarOpen: false, notificationsOpen: false, searchOpen: false },
  data: { users: [], products: [], orders: [], revenueData: [], activities: [] },
  tables: { users: { page: 1, limit: 10, search: '', sort: 'name', order: 'asc', filters: {} },
            products: { page: 1, limit: 10, search: '', sort: 'name', order: 'asc' },
            orders: { page: 1, limit: 10, search: '', sort: 'createdAt', order: 'desc' } }
};

// Initialize data
AppState.data.users = generateUsers(150);
AppState.data.products = generateProducts(50);
AppState.data.orders = generateOrders(200, AppState.data.users, AppState.data.products);
AppState.data.revenueData = generateRevenueData(365);
AppState.data.activities = generateActivities(100, AppState.data.users, AppState.data.orders);

// ==================== MOCK API ====================
const mockApi = {
  delay: (ms = 300) => new Promise(resolve => setTimeout(resolve, ms)),

  async login(email, password) {
    await this.delay();
    const user = AppState.data.users.find(u => u.email === email);
    if (!user || password.length < 6) throw new Error('Invalid email or password');
    const token = btoa(JSON.stringify({ userId: user.id, exp: Date.now() + 86400000 }));
    return { token, user };
  },

  async signup(data) {
    await this.delay();
    if (AppState.data.users.find(u => u.email === data.email)) throw new Error('Email already exists');
    const newUser = { id: `usr_${Math.random().toString(36).substr(2, 9)}`, ...data, role: 'user', status: 'active', plan: 'free', lastActive: new Date().toISOString(), joinedAt: new Date().toISOString(), bio: '', timezone: 'America/New_York', language: 'en' };
    AppState.data.users.push(newUser);
    const token = btoa(JSON.stringify({ userId: newUser.id, exp: Date.now() + 86400000 }));
    return { token, user: newUser };
  },

  async getUsers(page = 1, limit = 10, search = '', sort = 'name', order = 'asc', filters = {}) {
    await this.delay(200);
    let filtered = [...AppState.data.users];
    if (search) {
      const s = search.toLowerCase();
      filtered = filtered.filter(u => u.name.toLowerCase().includes(s) || u.email.toLowerCase().includes(s));
    }
    if (filters.role) filtered = filtered.filter(u => u.role === filters.role);
    if (filters.status) filtered = filtered.filter(u => u.status === filters.status);
    if (filters.plan) filtered = filtered.filter(u => u.plan === filters.plan);
    filtered.sort((a, b) => {
      let aVal = a[sort], bVal = b[sort];
      if (typeof aVal === 'string') { aVal = aVal.toLowerCase(); bVal = bVal.toLowerCase(); }
      return order === 'asc' ? (aVal > bVal ? 1 : -1) : (aVal < bVal ? 1 : -1);
    });
    const total = filtered.length;
    const pages = Math.ceil(total / limit);
    const start = (page - 1) * limit;
    return { users: filtered.slice(start, start + limit), total, pages, page: Math.min(page, pages || 1) };
  },

  async getDashboardStats() {
    await this.delay(200);
    const totalRevenue = AppState.data.revenueData.reduce((sum, d) => sum + d.revenue, 0);
    const activeUsers = AppState.data.users.filter(u => u.status === 'active').length;
    const now = new Date();
    const newSignups = AppState.data.users.filter(u => {
      const joined = new Date(u.joinedAt);
      return joined.getMonth() === now.getMonth() && joined.getFullYear() === now.getFullYear();
    }).length;
    const totalOrders = AppState.data.orders.length;
    const conversionRate = ((AppState.data.orders.length / AppState.data.users.length) * 100).toFixed(1);
    const avgOrderValue = (totalRevenue / totalOrders).toFixed(2);
    return {
      metrics: [
        { label: 'Total Revenue', value: `$${(totalRevenue / 1000000).toFixed(2)}M`, change: 12.5, trend: 'up' },
        { label: 'Active Users', value: activeUsers.toLocaleString(), change: 8.2, trend: 'up' },
        { label: 'New Signups', value: newSignups.toString(), change: -3.1, trend: 'down' },
        { label: 'Conversion Rate', value: `${conversionRate}%`, change: 5.4, trend: 'up' },
        { label: 'Churn Rate', value: '2.3%', change: -1.2, trend: 'up' },
        { label: 'Avg Order Value', value: `$${avgOrderValue}`, change: 7.8, trend: 'up' }
      ]
    };
  },

  async getRevenueData(range = '30d') {
    await this.delay(200);
    const days = range === '7d' ? 7 : range === '30d' ? 30 : range === '90d' ? 90 : 365;
    return AppState.data.revenueData.slice(-days);
  },

  async getTrafficSources() {
    await this.delay(100);
    return trafficSources;
  },

  async getActivities(limit = 10) {
    await this.delay(100);
    return AppState.data.activities.slice(0, limit);
  },

  async updateUser(id, data) {
    await this.delay(200);
    const idx = AppState.data.users.findIndex(u => u.id === id);
    if (idx === -1) throw new Error('User not found');
    AppState.data.users[idx] = { ...AppState.data.users[idx], ...data, updatedAt: new Date().toISOString() };
    return AppState.data.users[idx];
  },

  async deleteUser(id) {
    await this.delay(200);
    const idx = AppState.data.users.findIndex(u => u.id === id);
    if (idx === -1) throw new Error('User not found');
    AppState.data.users.splice(idx, 1);
    return { success: true };
  },

  async updateOrderStatus(id, status) {
    await this.delay(200);
    const idx = AppState.data.orders.findIndex(o => o.id === id);
    if (idx === -1) throw new Error('Order not found');
    AppState.data.orders[idx].status = status;
    AppState.data.orders[idx].updatedAt = new Date().toISOString();
    return AppState.data.orders[idx];
  }
};

// ==================== UTILITY FUNCTIONS ====================
function formatDate(dateStr, relative = false) {
  const date = new Date(dateStr);
  if (relative) {
    const diff = Date.now() - date.getTime();
    const minutes = Math.floor(diff / 60000);
    const hours = Math.floor(diff / 3600000);
    const days = Math.floor(diff / 86400000);
    if (minutes < 1) return 'Just now';
    if (minutes < 60) return `${minutes}m ago`;
    if (hours < 24) return `${hours}h ago`;
    if (days < 7) return `${days}d ago`;
    return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }
  return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}

function formatCurrency(amount) {
  return '$' + parseFloat(amount).toFixed(2).replace(/\d(?=(\d{3})+\.)/g, '$&,');
}

function formatNumber(num) {
  return num.toLocaleString();
}

function getInitials(name) {
  return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
}

function showToast(message, type = 'info', duration = 5000) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  const icons = { success: 'check-circle', error: 'x-circle', warning: 'alert-triangle', info: 'info' };
  const colors = { success: 'bg-emerald-500', error: 'bg-rose-500', warning: 'bg-amber-500', info: 'bg-blue-500' };
  toast.className = `${colors[type]} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 min-w-[300px] max-w-[400px] toast-enter pointer-events-auto`;
  toast.innerHTML = `
    <i data-lucide="${icons[type]}" class="w-5 h-5 flex-shrink-0"></i>
    <span class="text-sm font-medium">${message}</span>
    <button onclick="this.parentElement.remove()" class="ml-auto p-1 hover:bg-white/20 rounded transition-colors">
      <i data-lucide="x" class="w-4 h-4"></i>
    </button>
  `;
  container.appendChild(toast);
  requestAnimationFrame(() => { toast.classList.remove('toast-enter'); toast.classList.add('toast-enter-active'); });
  setTimeout(() => {
    toast.classList.remove('toast-enter-active');
    toast.classList.add('toast-exit-active');
    setTimeout(() => toast.remove(), 300);
  }, duration);
  if (window.lucide) lucide.createIcons();
}

            <i data-lucide="x" class="w-5 h-5 text-slate-500"></i>

// ==================== VALIDATORS ====================
const validators = {
  email: (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? null : 'Please enter a valid email address',
  password: (v) => {
    if (v.length < 8) return 'Password must be at least 8 characters';
    if (!/[A-Z]/.test(v)) return 'Must contain an uppercase letter';
    if (!/[0-9]/.test(v)) return 'Must contain a number';
    if (!/[@$!%*?&]/.test(v)) return 'Must contain a special character';
    return null;
  },
  required: (v) => v.trim() ? null : 'This field is required',
  minLength: (v, min) => v.length >= min ? null : `Must be at least ${min} characters`
};

function validateField(inputId, rules) {
  const input = document.getElementById(inputId);
  if (!input) return true;
  const value = input.value;
  let error = null;
  for (const rule of rules) {
    if (rule === 'email') error = validators.email(value);
    else if (rule === 'password') error = validators.password(value);
    else if (rule === 'required') error = validators.required(value);
    else if (rule.startsWith('min:')) error = validators.minLength(value, parseInt(rule.split(':')[1]));
    if (error) break;
  }
  const errorEl = document.getElementById(inputId + 'Error');
  if (errorEl) { errorEl.textContent = error || ''; errorEl.classList.toggle('hidden', !error); }
  input.classList.toggle('border-rose-500', !!error);
  input.classList.toggle('focus:ring-rose-500', !!error);
  input.classList.toggle('focus:ring-indigo-500', !error);
  return !error;
}

function clearValidation(inputId) {
  const input = document.getElementById(inputId);
  const errorEl = document.getElementById(inputId + 'Error');
  if (input) { input.classList.remove('border-rose-500', 'focus:ring-rose-500'); input.classList.add('focus:ring-indigo-500'); }
  if (errorEl) { errorEl.textContent = ''; errorEl.classList.add('hidden'); }
}

// ==================== AUTHENTICATION ====================
async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const rememberMe = document.getElementById('rememberMe')?.checked || false;

  const valid = validateField('loginEmail', ['required', 'email']) && validateField('loginPassword', ['required']);
  if (!valid) return;

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Signing in...</span>';
  if (window.lucide) lucide.createIcons();

  try {
    const { token, user } = await mockApi.login(email, password);
    AppState.auth = { user, isAuthenticated: true, token };
    if (rememberMe) localStorage.setItem('auth_token', token); else sessionStorage.setItem('auth_token', token);
    showToast(`Welcome back, ${user.name}!`, 'success');
    navigateTo('dashboard');
  } catch (err) {
    showToast(err.message, 'error');
    btn.disabled = false;
    btn.innerHTML = '<span>Sign in</span><i data-lucide="arrow-right" class="w-4 h-4"></i>';
    if (window.lucide) lucide.createIcons();
  }
}

async function handleSignup(e) {
  e.preventDefault();
  const name = document.getElementById('signupName').value;
  const email = document.getElementById('signupEmail').value;
  const password = document.getElementById('signupPassword').value;
  const confirm = document.getElementById('signupConfirm').value;

  let valid = validateField('signupName', ['required', 'min:2']) &&
              validateField('signupEmail', ['required', 'email']) &&
              validateField('signupPassword', ['required', 'password']);

  if (password !== confirm) {
    const errEl = document.getElementById('signupConfirmError');
    if (errEl) { errEl.textContent = 'Passwords do not match'; errEl.classList.remove('hidden'); }
    document.getElementById('signupConfirm').classList.add('border-rose-500');
    valid = false;
  }

  if (!valid) return;

  const btn = document.getElementById('signupBtn');
  btn.disabled = true;
  btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Creating account...</span>';
  if (window.lucide) lucide.createIcons();

  try {
    const { token, user } = await mockApi.signup({ name, email, password });
    AppState.auth = { user, isAuthenticated: true, token };
    localStorage.setItem('auth_token', token);
    showToast('Account created successfully!', 'success');
    navigateTo('dashboard');
  } catch (err) {
    showToast(err.message, 'error');
    btn.disabled = false;
    btn.innerHTML = '<span>Create account</span><i data-lucide="arrow-right" class="w-4 h-4"></i>';
    if (window.lucide) lucide.createIcons();
  }
}

async function handleReset(e) {
  e.preventDefault();
  const email = document.getElementById('resetEmail').value;
  if (!validateField('resetEmail', ['required', 'email'])) return;

  const btn = document.getElementById('resetBtn');
  btn.disabled = true;
  btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Sending...</span>';

function logout() {
  AppState.auth = { user: null, isAuthenticated: false, token: null };
  localStorage.removeItem('auth_token');
  sessionStorage.removeItem('auth_token');
  showToast('You have been logged out', 'info');
  navigateTo('login');
}

function checkAuth() {
  const token = localStorage.getItem('auth_token') || sessionStorage.getItem('auth_token');
  if (token) {
    try {
      const decoded = JSON.parse(atob(token));
      if (decoded.exp > Date.now()) {
        const user = AppState.data.users.find(u => u.id === decoded.userId);
        if (user) { AppState.auth = { user, isAuthenticated: true, token }; return true; }
      }
    } catch {}
  }
  return false;
}

function updatePasswordStrength(password) {
  const bar = document.getElementById('passwordStrength');
  if (!bar) return;
  let strength = 0;
  if (password.length >= 8) strength++;
  if (/[A-Z]/.test(password)) strength++;
  if (/[0-9]/.test(password)) strength++;
  if (/[@$!%*?&]/.test(password)) strength++;

  const classes = ['password-strength-weak', 'password-strength-medium', 'password-strength-strong', 'password-strength-strong'];
  const widths = ['25%', '50%', '75%', '100%'];
  const labels = ['Weak', 'Fair', 'Good', 'Strong'];

  bar.className = `h-1 rounded-full transition-all duration-300 ${classes[strength - 1] || 'bg-slate-200'}`;
  bar.style.width = widths[strength - 1] || '0%';
  const label = document.getElementById('passwordStrengthLabel');
  if (label) label.textContent = strength > 0 ? labels[strength - 1] : '';
}

// ==================== ROUTING ====================
const routes = {
  login: { auth: false, layout: 'auth' },
  signup: { auth: false, layout: 'auth' },
  reset: { auth: false, layout: 'auth' },
  dashboard: { auth: true, layout: 'main' },
  analytics: { auth: true, layout: 'main' },
  users: { auth: true, layout: 'main' },
  products: { auth: true, layout: 'main' },
  orders: { auth: true, layout: 'main' },
  settings: { auth: true, layout: 'main' }
};

function navigateTo(page) {
  const route = routes[page];
  if (!route) page = 'dashboard';

  if (routes[page]?.auth && !AppState.auth.isAuthenticated) {
    navigateTo('login'); return;
  }
  if (!routes[page]?.auth && AppState.auth.isAuthenticated && page !== 'reset') {
    navigateTo('dashboard'); return;
  }

  AppState.ui.currentPage = page;
  AppState.ui.sidebarOpen = false;
  AppState.ui.notificationsOpen = false;

  const app = document.getElementById('app');

  if (routes[page]?.layout === 'auth') {
    app.innerHTML = renderAuthPage(page);
  } else {
    app.innerHTML = `
      <div class="flex h-screen bg-slate-50 dark:bg-slate-900">
        ${renderSidebar()}
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
          ${renderTopBar()}
          <main class="flex-1 overflow-y-auto p-4 lg:p-6 animate-fade-in">${renderMainPage(page)}</main>
        </div>
      </div>
    `;
  }

  if (window.lucide) lucide.createIcons();
  initPageScripts(page);
  updateTheme();
  window.scrollTo(0, 0);
}

function renderAuthPage(page) {
  if (page === 'login') return renderLogin();
  if (page === 'signup') return renderSignup();
  if (page === 'reset') return renderReset();
  return renderLogin();
}

function renderMainPage(page) {
  if (page === 'dashboard') return renderDashboard();
  if (page === 'analytics') return renderAnalytics();
  if (page === 'users') return renderUsers();
  if (page === 'products') return renderProducts();
  if (page === 'orders') return renderOrders();
  if (page === 'settings') return renderSettings();
  return renderDashboard();
}

let revenueChartInstance = null;
let trafficChartInstance = null;
let userGrowthChartInstance = null;

function initDashboardCharts() {
  const isDark = document.documentElement.classList.contains('dark');

  // Revenue Chart
  const revenueCtx = document.getElementById('revenueChart');
  if (revenueCtx) {
    if (revenueChartInstance) revenueChartInstance.destroy();
    const data = AppState.data.revenueData.slice(-30);
    const gradient = revenueCtx.getContext('2d').createLinearGradient(0, 0, 0, 300);
    gradient.addColorStop(0, 'rgba(79, 70, 229, 0.3)');
    gradient.addColorStop(1, 'rgba(79, 70, 229, 0)');

    revenueChartInstance = new Chart(revenueCtx, {
      type: 'line',
      data: {
        labels: data.map(d => d.date.slice(5)),
        datasets: [{
          label: 'Revenue',
          data: data.map(d => d.revenue),
          borderColor: '#4f46e5',
          backgroundColor: gradient,
          fill: true,
          tension: 0.4,
          pointRadius: 0,
          pointHoverRadius: 6,
          pointHoverBackgroundColor: '#4f46e5',
          pointHoverBorderColor: '#fff',
          pointHoverBorderWidth: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { intersect: false, mode: 'index' },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: isDark ? '#1e293b' : '#fff',
            titleColor: isDark ? '#f8fafc' : '#0f172a',
            bodyColor: isDark ? '#94a3b8' : '#64748b',
            borderColor: isDark ? '#334155' : '#e2e8f0',
            borderWidth: 1,
            padding: 12,
            cornerRadius: 8,
            displayColors: false,
            callbacks: { label: (ctx) => `Revenue: $${ctx.parsed.y.toLocaleString()}` }
          }
        },
        scales: {
          x: { grid: { display: false }, ticks: { maxTicksLimit: 8, color: isDark ? '#64748b' : '#94a3b8' } },
          y: { border: { display: false }, grid: { color: isDark ? '#334155' : '#f1f5f9' }, ticks: { color: isDark ? '#64748b' : '#94a3b8', callback: (v) => '$' + (v / 1000) + 'k' } }
        }
      }
    });
  }

  // Traffic Chart
  const trafficCtx = document.getElementById('trafficChart');
  if (trafficCtx) {
    if (trafficChartInstance) trafficChartInstance.destroy();
    trafficChartInstance = new Chart(trafficCtx, {
      type: 'doughnut',
      data: {
        labels: trafficSources.map(d => d.name),
        datasets: [{
          data: trafficSources.map(d => d.value),
          backgroundColor: trafficSources.map(d => d.color),
          borderWidth: 0,
          hoverOffset: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '70%',
        plugins: {
          legend: {
            position: 'bottom',
            labels: { usePointStyle: true, pointStyle: 'circle', padding: 16, color: isDark ? '#94a3b8' : '#64748b' }
          }
        }
      }
    });
  }

  // User Growth Chart
  const growthCtx = document.getElementById('userGrowthChart');
  if (growthCtx) {
    if (userGrowthChartInstance) userGrowthChartInstance.destroy();
    const monthlyData = [];
    for (let i = 0; i < 12; i++) {
      const date = new Date();
      date.setMonth(date.getMonth() - (11 - i));
      const count = AppState.data.users.filter(u => new Date(u.joinedAt) <= date).length;
      monthlyData.push({ month: date.toLocaleDateString('en-US', { month: 'short' }), users: count });
    }

function exportDashboard() {
  const csv = 'Metric,Value,Change,Trend\n' + 
    AppState.data.revenueData.map(d => `${d.date},${d.revenue},${d.orders},revenue`).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'dashboard-data.csv';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Dashboard data exported', 'success');
}

function renderFunnel() {
  const stages = [
    { name: 'Visitors', value: 15000, color: 'bg-indigo-500' },
    { name: 'Signups', value: 3200, color: 'bg-blue-500' },
    { name: 'Active Users', value: 2100, color: 'bg-cyan-500' },
    { name: 'Paid Users', value: 850, color: 'bg-emerald-500' }
  ];
  const max = stages[0].value;
  return stages.map((s, i) => {
    const pct = (s.value / max) * 100;
    const prevPct = i > 0 ? (stages[i].value / stages[i-1].value) * 100 : 100;
    return `
      <div class="relative">
        <div class="flex items-center justify-between mb-1">
          <span class="text-sm font-medium text-slate-700 dark:text-slate-300">${s.name}</span>
          <div class="flex items-center gap-2">
            <span class="text-sm font-bold text-slate-900 dark:text-white">${s.value.toLocaleString()}</span>
            ${i > 0 ? `<span class="text-xs text-slate-500 dark:text-slate-400">${prevPct.toFixed(1)}% conversion</span>` : ''}
          </div>
        </div>
        <div class="h-8 bg-slate-100 dark:bg-slate-700 rounded-lg overflow-hidden">
          <div class="h-full ${s.color} rounded-lg transition-all duration-1000 flex items-center justify-end px-3" style="width: ${pct}%; min-width: 60px;">
            <span class="text-xs font-medium text-white">${pct.toFixed(1)}%</span>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

    loadUsersTable();

function filterUsers(key, value) {

function renderDataTable(data, columns, pagination) {
  return `
    <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left">
          <thead class="bg-slate-50 dark:bg-slate-700/50 border-b border-slate-200 dark:border-slate-700">
            <tr>
              ${columns.map(col => `
                <th class="px-6 py-3.5 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider ${col.sortable ? 'cursor-pointer hover:text-slate-700 dark:hover:text-slate-300 select-none' : ''}" 
                    ${col.sortable ? `onclick="sortTable('${col.key}')"` : ''}>
                  <div class="flex items-center gap-1">
                    ${col.label}
                    ${col.sortable ? `<i data-lucide="arrow-up-down" class="w-3 h-3 ${pagination.sort === col.key ? 'text-indigo-500' : 'text-slate-400'}"></i>` : ''}
                  </div>
                </th>
              `).join('')}
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-200 dark:divide-slate-700">
            ${data.length === 0 ? `
              <tr>
                <td colspan="${columns.length}" class="px-6 py-12 text-center">
                  <div class="w-16 h-16 bg-slate-100 dark:bg-slate-700 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i data-lucide="search-x" class="w-8 h-8 text-slate-400"></i>
                  </div>
                  <p class="text-sm text-slate-500 dark:text-slate-400">No results found</p>
                </td>
              </tr>
            ` : data.map(row => `
              <tr class="hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors group">
                ${columns.map(col => `
                  <td class="px-6 py-4 whitespace-nowrap ${col.key === 'actions' ? 'text-right' : ''}">
                    ${col.render ? col.render(row) : `<span class="text-sm text-slate-900 dark:text-slate-100">${row[col.key] || '-'}</span>`}
                  </td>
                `).join('')}
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
      ${pagination.total > 0 ? renderPagination(pagination.page, pagination.pages, pagination.total, 'users') : ''}
    </div>
  `;
}

function renderPagination(page, pages, total, tableKey) {
  const start = (page - 1) * 10 + 1;
  const end = Math.min(page * 10, total);
  const maxButtons = 5;
  let startPage = Math.max(1, page - Math.floor(maxButtons / 2));
  let endPage = Math.min(pages, startPage + maxButtons - 1);
  if (endPage - startPage < maxButtons - 1) startPage = Math.max(1, endPage - maxButtons + 1);

  return `
    <div class="flex flex-col sm:flex-row items-center justify-between px-6 py-4 border-t border-slate-200 dark:border-slate-700 gap-3">
      <p class="text-sm text-slate-500 dark:text-slate-400">
        Showing <span class="font-medium text-slate-900 dark:text-white">${start}</span> to <span class="font-medium text-slate-900 dark:text-white">${end}</span> of <span class="font-medium text-slate-900 dark:text-white">${total}</span> results
      </p>
      <div class="flex items-center gap-1">
        <button onclick="changePage('${tableKey}', ${page - 1})" ${page === 1 ? 'disabled' : ''} 
          class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
          <i data-lucide="chevron-left" class="w-4 h-4 text-slate-600 dark:text-slate-400"></i>
        </button>
        ${startPage > 1 ? `<button onclick="changePage('${tableKey}', 1)" class="w-8 h-8 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">1</button><span class="px-1 text-slate-400">...</span>` : ''}
        ${Array.from({ length: endPage - startPage + 1 }, (_, i) => {
          const p = startPage + i;
          return `<button onclick="changePage('${tableKey}', ${p})" class="w-8 h-8 rounded-lg text-sm font-medium transition-colors ${p === page ? 'bg-indigo-600 text-white' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700'}">${p}</button>`;
        }).join('')}
        ${endPage < pages ? `<span class="px-1 text-slate-400">...</span><button onclick="changePage('${tableKey}', ${pages})" class="w-8 h-8 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">${pages}</button>` : ''}
        <button onclick="changePage('${tableKey}', ${page + 1})" ${page === pages ? 'disabled' : ''} 
          class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
          <i data-lucide="chevron-right" class="w-4 h-4 text-slate-600 dark:text-slate-400"></i>
        </button>
      </div>
    </div>
  `;
}

function sortTable(key) {
  const page = AppState.ui.currentPage;
  const t = AppState.tables[page] || AppState.tables.users;
  if (t.sort === key) {
    t.order = t.order === 'asc' ? 'desc' : 'asc';
  } else {
    t.sort = key;
    t.order = 'asc';
  }
  if (page === 'users') loadUsersTable();
  else if (page === 'products') loadProductsTable();
  else if (page === 'orders') loadOrdersTable();
}

function changePage(tableKey, page) {
  AppState.tables[tableKey].page = page;
  if (tableKey === 'users') loadUsersTable();
  else if (tableKey === 'products') loadProductsTable();
  else if (tableKey === 'orders') loadOrdersTable();
}

let productSearchTimeout;
function debounceProductSearch(value) {
  clearTimeout(productSearchTimeout);
  productSearchTimeout = setTimeout(() => {
    AppState.tables.products.search = value;
    AppState.tables.products.page = 1;
    loadProductsTable();
  }, 300);
}

function filterProducts(key, value) {
  AppState.tables.products.filters = { [key]: value || null };
  AppState.tables.products.page = 1;
  loadProductsTable();
}

async function loadProductsTable() {
  const container = document.getElementById('productsTableContainer');
  if (!container) return;

  const t = AppState.tables.products;
  let filtered = [...AppState.data.products];
  if (t.search) {
    const s = t.search.toLowerCase();
    filtered = filtered.filter(p => p.name.toLowerCase().includes(s) || p.sku.toLowerCase().includes(s));
  }
  if (t.filters?.category) filtered = filtered.filter(p => p.category === t.filters.category);

  filtered.sort((a, b) => {
    let aVal = a[t.sort], bVal = b[t.sort];
    if (typeof aVal === 'string') { aVal = aVal.toLowerCase(); bVal = bVal.toLowerCase(); }
    return t.order === 'asc' ? (aVal > bVal ? 1 : -1) : (aVal < bVal ? 1 : -1);
  });

  const total = filtered.length;
  const pages = Math.ceil(total / t.limit);
  const start = (t.page - 1) * t.limit;
  const pageData = filtered.slice(start, start + t.limit);

  const columns = [
    { key: 'product', label: 'Product', sortable: false, render: (p) => `
      <div class="flex items-center gap-3">
        <img src="${p.image}" alt="${p.name}" class="w-10 h-10 rounded-lg bg-slate-200 dark:bg-slate-700 object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
        <div class="w-10 h-10 rounded-lg bg-slate-200 dark:bg-slate-700 items-center justify-center hidden">
          <i data-lucide="package" class="w-5 h-5 text-slate-400"></i>
        </div>
        <div>
          <p class="text-sm font-medium text-slate-900 dark:text-white">${p.name}</p>
          <p class="text-xs text-slate-500 dark:text-slate-400">${p.sku}</p>
        </div>
      </div>
    `},
    { key: 'category', label: 'Category', sortable: true, render: (p) => `<span class="text-sm text-slate-600 dark:text-slate-400">${p.category}</span>` },
    { key: 'price', label: 'Price', sortable: true, render: (p) => `<span class="text-sm font-medium text-slate-900 dark:text-white">${formatCurrency(p.price)}</span>` },
    { key: 'stock', label: 'Stock', sortable: true, render: (p) => `
      <div class="flex items-center gap-2">
        <span class="text-sm ${p.stock > 50 ? 'text-emerald-600' : p.stock > 10 ? 'text-amber-600' : 'text-rose-600'}">${p.stock}</span>
        <span class="w-2 h-2 rounded-full ${p.stock > 50 ? 'bg-emerald-500' : p.stock > 10 ? 'bg-amber-500' : 'bg-rose-500'}"></span>
      </div>
    ` },
    { key: 'status', label: 'Status', sortable: true, render: (p) => Badge(p.status, p.status === 'active' ? 'active' : p.status === 'draft' ? 'pending' : 'inactive') },
    { key: 'sales', label: 'Sales', sortable: true, render: (p) => `<span class="text-sm text-slate-600 dark:text-slate-400">${p.sales.toLocaleString()}</span>` },
    { key: 'actions', label: '', sortable: false, render: (p) => `
      <div class="flex items-center gap-1 justify-end opacity-0 group-hover:opacity-100 transition-opacity">
        <button onclick="editProduct('${p.id}')" class="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition-colors" title="Edit">
          <i data-lucide="pencil" class="w-4 h-4 text-slate-500"></i>
        </button>
        <button onclick="confirmDeleteProduct('${p.id}')" class="p-1.5 hover:bg-rose-100 dark:hover:bg-rose-900/30 rounded-lg transition-colors" title="Delete">
          <i data-lucide="trash-2" class="w-4 h-4 text-rose-500"></i>
        </button>
      </div>
    `}
  ];

  container.innerHTML = renderDataTable(pageData, columns, { page: t.page, pages, total, sort: t.sort, order: t.order });
  if (window.lucide) lucide.createIcons();
}

let orderSearchTimeout;
function debounceOrderSearch(value) {
  clearTimeout(orderSearchTimeout);
  orderSearchTimeout = setTimeout(() => {
    AppState.tables.orders.search = value;
    AppState.tables.orders.page = 1;
    loadOrdersTable();
  }, 300);
}

function filterOrders(key, value) {
  AppState.tables.orders.filters = { [key]: value || null };
  AppState.tables.orders.page = 1;
  loadOrdersTable();
}

async function loadOrdersTable() {
  const container = document.getElementById('ordersTableContainer');
  if (!container) return;

  const t = AppState.tables.orders;
  let filtered = [...AppState.data.orders];
  if (t.search) {
    const s = t.search.toLowerCase();
    filtered = filtered.filter(o => o.id.toLowerCase().includes(s) || o.customerName.toLowerCase().includes(s));
  }
  if (t.filters?.status) filtered = filtered.filter(o => o.status === t.filters.status);

  filtered.sort((a, b) => {
    let aVal = a[t.sort], bVal = b[t.sort];
    if (t.sort === 'createdAt') { aVal = new Date(aVal); bVal = new Date(bVal); }
    return t.order === 'asc' ? (aVal > bVal ? 1 : -1) : (aVal < bVal ? 1 : -1);
  });

  const total = filtered.length;
  const pages = Math.ceil(total / t.limit);
  const start = (t.page - 1) * t.limit;
  const pageData = filtered.slice(start, start + t.limit);

  const columns = [
    { key: 'id', label: 'Order ID', sortable: true, render: (o) => `<span class="text-sm font-mono font-medium text-slate-900 dark:text-white">${o.id}</span>` },
    { key: 'customer', label: 'Customer', sortable: true, render: (o) => `
      <div>
        <p class="text-sm font-medium text-slate-900 dark:text-white">${o.customerName}</p>
        <p class="text-xs text-slate-500 dark:text-slate-400">${o.customerEmail}</p>
      </div>
    `},
    { key: 'date', label: 'Date', sortable: true, render: (o) => `<span class="text-sm text-slate-600 dark:text-slate-400">${formatDate(o.createdAt)}</span>` },
    { key: 'total', label: 'Total', sortable: true, render: (o) => `<span class="text-sm font-medium text-slate-900 dark:text-white">${formatCurrency(o.total)}</span>` },
    { key: 'status', label: 'Status', sortable: true, render: (o) => Badge(o.status, o.status + '_order') },
    { key: 'items', label: 'Items', sortable: false, render: (o) => `<span class="text-sm text-slate-600 dark:text-slate-400">${o.items.length} item${o.items.length > 1 ? 's' : ''}</span>` },
    { key: 'actions', label: '', sortable: false, render: (o) => `
      <div class="flex items-center gap-1 justify-end opacity-0 group-hover:opacity-100 transition-opacity">
        <button onclick="viewOrder('${o.id}')" class="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition-colors" title="View">
          <i data-lucide="eye" class="w-4 h-4 text-slate-500"></i>
        </button>
        ${o.status !== 'delivered' && o.status !== 'cancelled' ? `
        <button onclick="updateOrderStatus('${o.id}')" class="p-1.5 hover:bg-blue-100 dark:hover:bg-blue-900/30 rounded-lg transition-colors" title="Update Status">
          <i data-lucide="refresh-cw" class="w-4 h-4 text-blue-500"></i>
        </button>
        ` : ''}
      </div>
    `}
  ];

  container.innerHTML = renderDataTable(pageData, columns, { page: t.page, pages, total, sort: t.sort, order: t.order });
  if (window.lucide) lucide.createIcons();
}

  showModal('Update Order Status', `
    <div class="text-center">
      <p class="text-sm text-slate-600 dark:text-slate-400 mb-4">Change status from ${Badge(order.status, order.status + '_order')} to ${Badge(nextStatus, nextStatus + '_order')}?</p>
    </div>
  `, `confirmUpdateOrderStatus('${id}', '${nextStatus}')`);
}

async function confirmUpdateOrderStatus(id, status) {
  try {
    await mockApi.updateOrderStatus(id, status);
    showToast(`Order status updated to ${status}`, 'success');
    loadOrdersTable();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

function exportOrders() {
  const csv = 'Order ID,Customer,Date,Total,Status,Items\n' + 
    AppState.data.orders.map(o => `${o.id},${o.customerName},${o.createdAt},${o.total},${o.status},${o.items.length}`).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'orders.csv';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Orders exported successfully', 'success');
}

    { color: '#f59e0b', label: 'Amber' },

    { color: '#8b5cf6', label: 'Violet' }

  return `

      <div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          ${themes.map(t => `
            <button onclick="setTheme('${t.id}')" class="p-4 border-2 rounded-xl transition-all text-left ${AppState.theme.mode === t.id ? 'border-indigo-500 bg-indigo-50 dark:bg-indigo-900/20' : 'border-slate-200 dark:border-slate-700 hover:border-slate-300 dark:hover:border-slate-600'}">

        <h4 class="text-lg font-medium text-slate-900 dark:text-white mb-4">Density</h4>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          ${densities.map(d => `
            <button onclick="setDensity('${d.id}')" class="p-4 border-2 rounded-xl transition-all text-left ${AppState.theme.density === d.id ? 'border-indigo-500 bg-indigo-50 dark:bg-indigo-900/20' : 'border-slate-200 dark:border-slate-700 hover:border-slate-300 dark:hover:border-slate-600'}">
              <p class="text-sm font-medium text-slate-900 dark:text-white">${d.label}</p>

      </div>

      <div class="border-t border-slate-200 dark:border-slate-700 pt-6">
        <h4 class="text-lg font-medium text-slate-900 dark:text-white mb-4">Accent Color</h4>
        <div class="flex flex-wrap gap-3">
          ${accents.map(a => `
            <button onclick="setAccentColor('${a.color}')" class="w-12 h-12 rounded-full border-2 transition-all ${AppState.theme.accentColor === a.color ? 'border-slate-900 dark:border-white scale-110' : 'border-transparent hover:scale-105'}" style="background-color: ${a.color}" title="${a.label}"></button>
          `).join('')}
        </div>
      </div>

      <div class="border-t border-slate-200 dark:border-slate-700 pt-6">
        <h4 class="text-lg font-medium text-slate-900 dark:text-white mb-4">Accessibility</h4>
        <div class="flex items-center justify-between p-4 bg-slate-50 dark:bg-slate-700/50 rounded-lg">
          <div>
            <p class="text-sm font-medium text-slate-900 dark:text-white">Reduced Motion</p>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Minimize animations and transitions</p>
          </div>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="reducedMotion" class="sr-only peer" onchange="toggleReducedMotion(this.checked)">
            <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-indigo-300 dark:peer-focus:ring-indigo-800 rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:after:border-slate-600 peer-checked:bg-indigo-600"></div>
          </label>
        </div>
      </div>
    </div>
  `;
}

function setTheme(mode) {
  AppState.theme.mode = mode;
  localStorage.setItem('theme', mode);
  updateTheme();
  switchSettingsTab('appearance');
  showToast(`Theme set to ${mode}`, 'success');
}

function setDensity(density) {
  AppState.theme.density = density;
  showToast(`Density set to ${density}`, 'success');
}

function setAccentColor(color) {
  AppState.theme.accentColor = color;
  showToast('Accent color updated', 'success');
}

function toggleReducedMotion(checked) {
  document.documentElement.style.setProperty('--reduce-motion', checked ? 'reduce' : 'no-preference');
  showToast(checked ? 'Reduced motion enabled' : 'Reduced motion disabled', 'info');
}

function renderNotificationSettings() {
  const channels = [
    { id: 'email', label: 'Email Notifications', desc: 'Receive updates via email', icon: 'mail' },
    { id: 'push', label: 'Push Notifications', desc: 'Browser push notifications', icon: 'bell' },
    { id: 'inapp', label: 'In-App Notifications', desc: 'Show notifications within the app', icon: 'smartphone' }
  ];

    { id: 'account', label: 'Account Activity', desc: 'Logins, password changes, security alerts' },
    { id: 'users', label: 'New Users', desc: 'When new users sign up' },

                <div class="w-10 h-10 rounded-lg bg-white dark:bg-slate-600 flex items-center justify-center">
                  <i data-lucide="${c.icon}" class="w-5 h-5 text-slate-500 dark:text-slate-400"></i>
                </div>
                <div>
                  <p class="text-sm font-medium text-slate-900 dark:text-white">${c.label}</p>
                  <p class="text-xs text-slate-500 dark:text-slate-400">${c.desc}</p>
                </div>
              </div>
              <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" class="sr-only peer" checked>
                <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-indigo-300 dark:peer-focus:ring-indigo-800 rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:after:border-slate-600 peer-checked:bg-indigo-600"></div>
              </label>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="border-t border-slate-200 dark:border-slate-700 pt-6">
        <h4 class="text-lg font-medium text-slate-900 dark:text-white mb-4">Notification Categories</h4>
        <div class="space-y-3">
          ${categories.map(c => `
            <div class="flex items-center justify-between p-4 bg-slate-50 dark:bg-slate-700/50 rounded-lg">
              <div>
                <p class="text-sm font-medium text-slate-900 dark:text-white">${c.label}</p>
                <p class="text-xs text-slate-500 dark:text-slate-400">${c.desc}</p>
              </div>
              <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" class="sr-only peer" ${c.id !== 'marketing' ? 'checked' : ''}>
                <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-indigo-300 dark:peer-focus:ring-indigo-800 rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:after:border-slate-600 peer-checked:bg-indigo-600"></div>
              </label>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

// ==================== PAGE INITIALIZATION ====================
function initPageScripts(page) {
  if (page === 'dashboard') {
    setTimeout(() => loadDashboardData(), 100);
  } else if (page === 'analytics') {
    setTimeout(() => initAnalyticsCharts(), 100);
  } else if (page === 'users') {
    setTimeout(() => loadUsersTable(), 100);
  } else if (page === 'products') {
    setTimeout(() => loadProductsTable(), 100);
  } else if (page === 'orders') {
    setTimeout(() => loadOrdersTable(), 100);
  }
}

// ==================== APP INITIALIZATION ====================
document.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme') || 'system';
  AppState.theme.mode = savedTheme;
  updateTheme();

  if (checkAuth()) {
    navigateTo('dashboard');
  } else {
    navigateTo('login');
  }

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (AppState.theme.mode === 'system') updateTheme();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'k' && (e.metaKey || e.ctrlKey)) {
      e.preventDefault();
      showToast('Search coming soon', 'info');
    }
    if (e.key === 'Escape') {
      closeModal();
      AppState.ui.notificationsOpen = false;
      if (AppState.ui.currentPage !== 'login' && AppState.ui.currentPage !== 'signup' && AppState.ui.currentPage !== 'reset') {
        navigateTo(AppState.ui.currentPage);
      }
    }
  });

  document.addEventListener('click', (e) => {
    if (AppState.ui.notificationsOpen) {
      const dropdown = e.target.closest('.relative');
      if (!dropdown) {
        AppState.ui.notificationsOpen = false;
        if (AppState.ui.currentPage !== 'login' && AppState.ui.currentPage !== 'signup' && AppState.ui.currentPage !== 'reset') {
          navigateTo(AppState.ui.currentPage);
        }
      }
    }
  });
});

// Handle browser back/forward buttons
window.addEventListener('popstate', () => {
  // Hash-based routing handled by navigateTo
});
</script>
